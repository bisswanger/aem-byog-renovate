name: Renovate branch validation

# Validate every branch Renovate creates by running a full Maven build.
on:
  push:
    branches:
      - "renovate/**"
  workflow_dispatch:

# Cancel superseded runs when Renovate force-pushes to the same branch.
concurrency:
  group: renovate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn clean verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn clean verify
        run: mvn --batch-mode --no-transfer-progress clean verify
